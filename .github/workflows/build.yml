name: Build Sky VeLor

# The ForgeGradle 2.1 / Minecraft 1.8.9 toolchain needs a JDK 8 and network access to the Forge
# Maven and Mojang's servers. This workflow is that environment: it checks out the revision it was
# triggered by, builds with the project's own Gradle wrapper, runs the standalone tests, verifies
# that the output really is the reobfuscated Sky VeLor mod jar, and publishes it.
#
# Nothing here hardcodes a version or a revision. The version is read from PekaVersion.NAME, which
# build.gradle also reads, so the jar name, mcmod.info, the release tag and the verification all
# follow the source automatically.
#
# The dist/ publish step commits the built jar back to the branch, so this needs write access.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [ main ]

env:
  # Resolved once and reused; never hardcoded, so a version bump needs no workflow edit.
  VERSION_FILE: src/main/java/com/arena/pekaclient/PekaVersion.java

jobs:
  build:
    name: Build with Java 8
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the revision this run was triggered by
        uses: actions/checkout@v4
        with:
          # The release step below has to prove that the tag it is publishing is already on
          # main, which needs real history rather than a single-commit checkout. 58 commits.
          fetch-depth: 0

      - name: Set up Java 8 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache the Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle8-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle8-

      - name: Resolve the release version from source
        run: |
          set -e
          VERSION=$(grep -oE 'NAME *= *"[^"]+"' "$VERSION_FILE" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error title=VERSION::could not read PekaVersion.NAME from $VERSION_FILE"
            exit 1
          fi
          MCMOD_VERSION=$(printf '%s' "$VERSION" | sed -E 's/^Beta-//; s/v$//')
          if ! printf '%s' "$MCMOD_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error title=VERSION::could not resolve numeric mcmod.info version from $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MCMOD_VERSION=$MCMOD_VERSION" >> "$GITHUB_ENV"
          echo "JAR_NAME=SkyVeLor-1.8.9-$VERSION.jar" >> "$GITHUB_ENV"
          echo "ZIP_NAME=SkyVeLor-1.8.9-$VERSION.zip" >> "$GITHUB_ENV"
          {
            echo "revision : $(git rev-parse HEAD)"
            echo "branch   : ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "version  : $VERSION"
            echo "mcmod    : $MCMOD_VERSION"
            echo "java     : $(java -version 2>&1 | head -1)"
          } | tee "$RUNNER_TEMP/revision.txt"

      - name: Build the mod (ForgeGradle 2.1, Minecraft 1.8.9)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --version 2>&1 | tee "$RUNNER_TEMP/gradle-version.txt"
          if ! ./gradlew clean build dumpTestClasspath --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Surface actionable compiler/dependency lines as annotations when Actions log redirects are unavailable.
            grep -E '(^|[[:space:]])(error:|FAILURE:|Could not |Exception|Execution failed|[0-9]+ errors?)' \
              "$RUNNER_TEMP/build.log" | tail -50 | while IFS= read -r line; do
                echo "::error title=GRADLE::${line}"
              done
            exit 1
          fi
          echo "=== tasks that produced the jar ==="
          grep -E "^:(compileJava|jar|reobfJar|sourceJar|assemble|check|build)" "$RUNNER_TEMP/build.log" || true
          tail -6 "$RUNNER_TEMP/build.log"

      - name: Inventory every jar produced
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -lh build/libs/ 2>/dev/null || echo "build/libs not found"
          echo "=== every jar under build/ ==="
          # build/tmp/deobfMcMCP/deobfed.jar is ForgeGradle's deobfuscated Minecraft, about 11 MB.
          # It is NOT the mod. A previous release was published from it by mistake.
          find build -name '*.jar' -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2

      - name: Run the standalone logic tests
        run: |
          set -o pipefail
          if ! TEST_CP="$(cat build/test-classpath.txt)" sh tests/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            # Action log downloads may be blocked by a redirect in restricted environments. Mirror the actual
            # assertion lines into check annotations so a failed headless suite is always diagnosable.
            grep -E '^(FAIL |.*passed [0-9]+, failed [1-9])' "$RUNNER_TEMP/tests.log" | tail -50 | while IFS= read -r line; do
              echo "::error title=LOGIC-TEST::${line}"
            done
            echo "::error title=LOGIC-TEST::tests/run-tests.sh exited nonzero"
            exit 1
          fi
          echo "=== suites ==="
          grep -E "passed [0-9]+, failed" "$RUNNER_TEMP/tests.log" | tail -40

      - name: Verify the release jar is really the reobfuscated mod
        run: |
          # GitHub's default shell is `bash -e -o pipefail`, which would abort on the verifier's
          # first nonzero status before it printed why. Report first, then fail.
          set +e +o pipefail
          JAR="$PWD/build/libs/$JAR_NAME"
          echo "expected artifact: $JAR"
          if [ ! -f "$JAR" ]; then
            echo "::error title=JAR::$JAR_NAME was not produced"
            find "$PWD/build" -name '*.jar' -printf '%10s %p\n' | sort -k2
            exit 1
          fi
          python3 tools/verify_release_jar.py "$JAR" --version "$VERSION" --mcmod-version "$MCMOD_VERSION" > "$RUNNER_TEMP/verify.txt" 2>&1
          RC=$?
          cat "$RUNNER_TEMP/verify.txt"
          grep '^  FAIL' "$RUNNER_TEMP/verify.txt" | while read -r line; do
            echo "::error title=JAR-VERIFY::${line}"
          done
          tail -1 "$RUNNER_TEMP/verify.txt" | while read -r line; do
            echo "::notice title=JAR-VERIFY::${line}"
          done
          if [ "$RC" != "0" ]; then
            echo "::error title=JAR::release verification failed with exit $RC"
            exit "$RC"
          fi
          echo "::notice title=JAR::verified $JAR_NAME $(stat -c%s "$JAR") bytes version=$VERSION"

      - name: Write the build report
        run: |
          set -e
          JAR="build/libs/$JAR_NAME"
          {
            echo "Sky VeLor $VERSION build report"
            echo "================================"
            cat "$RUNNER_TEMP/revision.txt"
            echo "run      : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "gradle:"
            sed -n '1,12p' "$RUNNER_TEMP/gradle-version.txt"
            echo
            echo "jar      : dist/$JAR_NAME"
            echo "size     : $(stat -c%s "$JAR") bytes"
            echo "sha256   : $(sha256sum "$JAR" | cut -d' ' -f1)"
            echo
            echo "gradle tasks that produced the jar:"
            grep -E "^:(compileJava|jar|reobfJar|sourceJar|assemble|check|build)" "$RUNNER_TEMP/build.log" || echo "(none listed)"
            echo
            echo "reobfuscated: yes - tools/verify_release_jar.py confirmed SRG member references"
            echo "              and no development (MCP) member names left in the packaged classes."
            echo
            echo "test suites:"
            grep -E "passed [0-9]+, failed" "$RUNNER_TEMP/tests.log" || true
            echo
            echo "verification:"
            cat "$RUNNER_TEMP/verify.txt"
          } > BUILD-REPORT.txt
          grep -vE '^      (func|field)_' BUILD-REPORT.txt | tail -45

      - name: Create the delivery zip
        run: |
          set -e
          JAR="build/libs/$JAR_NAME"
          ZIP="build/delivery/$ZIP_NAME"
          mkdir -p build/delivery
          python3 - "$JAR" "$ZIP" BUILD-REPORT.txt <<'PY'
          import os
          import sys
          import zipfile
          jar, output, report = sys.argv[1:]
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write(jar, os.path.basename(jar))
              archive.write(report, os.path.basename(report))
          with zipfile.ZipFile(output) as archive:
              print('delivery zip:', output)
              for item in archive.infolist():
                  print('  %s %d bytes' % (item.filename, item.file_size))
          PY

      - name: Publish only the jar and zip into dist/ on this branch
        if: github.event_name == 'push'
        run: |
          set +e +o pipefail
          # A release directory is deliberately a two-file delivery surface: the new JAR and its ZIP.
          # Remove every prior artifact only after build, tests, and JAR verification have passed.
          rm -rf dist
          mkdir -p dist
          cp -v "build/libs/$JAR_NAME" "dist/$JAR_NAME"
          cp -v "build/delivery/$ZIP_NAME" "dist/$ZIP_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A dist
          if git diff --cached --quiet; then
            echo "dist/ is already up to date"
            exit 0
          fi
          git commit -m "Publish $JAR_NAME built from $GITHUB_SHA [skip ci]"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RC=$?
          echo "push exit=$RC"
          if [ "$RC" != "0" ]; then
            echo "::error title=DIST::could not publish dist/ (exit $RC)"
            exit "$RC"
          fi
          echo "::notice title=DIST::published dist/$JAR_NAME and $ZIP_NAME"

      - name: Attach the jar to a GitHub release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          JAR="dist/$JAR_NAME"
          ZIP="dist/$ZIP_NAME"
          TAG="SkyVeLor-$VERSION"
          printf '%s\n' \
            "Minecraft 1.8.9 Forge mod built by the Build Sky VeLor workflow." \
            "" \
            "Built from commit $GITHUB_SHA. The release carries the verified JAR and delivery ZIP." \
            "" \
            "Install: put $JAR_NAME in the Minecraft mods folder." \
            "Requires Minecraft 1.8.9 with Forge 11.15.1.2318 and Java 8." > release-notes.txt
          cat release-notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$ZIP" --clobber
          else
            gh release create "$TAG" "$JAR" "$ZIP" \
              --title "Sky VeLor $VERSION" --notes-file release-notes.txt
          fi
          echo "::notice title=RELEASE::$TAG published with $JAR_NAME and $ZIP_NAME"

      # A squash merge into main is performed through the API, and GitHub does not always
      # schedule a workflow run for it - which leaves the release created but carrying no
      # assets. This closes that gap from a branch build: if the release tag already exists
      # and is on main, upload what main carries at that tag.
      #
      # The assets come from the tag, not from this branch's rebuild, so a release can never
      # be populated from unmerged work. The rebuild is only used as a cross-check: if this
      # branch compiles the same source into different bytes, that is worth failing on.
      - name: Attach the tagged artifacts to the release (tag already on main)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="SkyVeLor-$VERSION"
          git fetch --no-tags --force origin \
            '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "no tag $TAG yet - nothing to attach from $GITHUB_REF_NAME"
            exit 0
          fi
          TAG_SHA=$(git rev-list -n1 "$TAG")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "tag $TAG ($TAG_SHA) is not on main - refusing to publish a release from $GITHUB_REF_NAME"
            exit 0
          fi
          mkdir -p release-assets
          git show "$TAG:dist/$JAR_NAME" > "release-assets/$JAR_NAME"
          git show "$TAG:dist/$ZIP_NAME" > "release-assets/$ZIP_NAME"
          WANT=$(sha256sum "release-assets/$JAR_NAME" | cut -d' ' -f1)
          GOT=$(sha256sum "build/libs/$JAR_NAME" | cut -d' ' -f1)
          echo "jar published on main at $TAG : $WANT"
          echo "jar rebuilt by this run       : $GOT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::error title=RELEASE::$GITHUB_REF_NAME rebuilt a jar that differs from the one on main at $TAG - not attaching anything"
            exit 1
          fi
          echo "identical - attaching main's own artifacts to $TAG"
          gh release upload "$TAG" "release-assets/$JAR_NAME" "release-assets/$ZIP_NAME" --clobber
          gh release view "$TAG" --json name,tagName,assets \
            --jq '"release \(.name) (\(.tagName)) carries: " + ([.assets[] | "\(.name) \(.size) bytes"] | join(", "))'
          echo "::notice title=RELEASE::attached $JAR_NAME and $ZIP_NAME to $TAG"

      - name: Upload the release jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyVeLor-1.8.9-${{ env.VERSION }}
          path: |
            build/libs/${{ env.JAR_NAME }}
            build/delivery/${{ env.ZIP_NAME }}
            BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/
            build/logs/
          if-no-files-found: ignore
          retention-days: 14
