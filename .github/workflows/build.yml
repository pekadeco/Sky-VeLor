name: Build SkyVeLor Beta-0.8v

# Builds the Minecraft 1.8.9 Forge client mod and publishes the deliverables:
#   SkyVeLor-1.8.9-Beta-0.8v.jar
#   SkyVeLor-1.8.9-Beta-0.8v-source.zip
#
# Toolchain: JDK 8 + Gradle 2.14.1 + ForgeGradle 2.1-SNAPSHOT (from https://maven.minecraftforge.net).
#
# Reobfuscation note, because it is easy to get wrong: ForgeGradle's Forge plugin reobfuscates mod jars with
# ReobfMappingType.SEARGE (see ForgePlugin.setupReobf), not NOTCH. A correct Forge 1.8.9 release jar therefore
# keeps MCP class names - FML's runtime remapper maps them to notch names at launch - while every member name
# becomes an srg name (func_NNNN_x / field_NNNN_x). The verification below asserts exactly that: no MCP member
# names may survive, and srg member names must be present.

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build + verify Beta-0.8v
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      GRADLE_VERSION: '2.14.1'
      PROJECT_DIR: SkyVeLor-Beta-0.7v
      JAR_NAME: SkyVeLor-1.8.9-Beta-0.8v.jar
      ZIP_NAME: SkyVeLor-1.8.9-Beta-0.8v-source.zip
      EXPECTED_VERSION: 'Beta-0.8v'
      GRADLE_OPTS: '-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Report toolchain
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "checked out: $(git rev-parse HEAD)"

      - name: Install Gradle ${GRADLE_VERSION}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --version

      # `gradle build` -> assemble -> reobfJar (ForgeGradle reobfuscates the jar in place) -> build/libs.
      # decompileMc is NOT in this task graph: UserBasePlugin wires compileJava to deobfMcMCP, and only
      # setupDecompWorkspace pulls in decompileMc, so no "-x decompileMc" is needed.
      # ForgeGradle downloads Forge's MCP mappings JSON (BasePlugin.getRemoteJsons) and keeps it in
      # ~/.gradle/caches/forge_gradle/McpMappings.json behind an ETag. If that fetch or its revalidation
      # hiccups, the field stays null and setting `mappings` dies with a NullPointerException inside
      # ForgeGradle - a transient infrastructure failure, nothing to do with the mod's source. (Seen once on
      # 2026-10-15: pull-request run 38717806541 failed that way while the same revision built fine on push.)
      # So the build is retried, and the ETag/cached copy is dropped first so the retry refetches instead of
      # reusing whatever made the first attempt fail.
      - name: Build mod (gradle build dumpTestClasspath)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== gradle build, attempt ${attempt}/3 ==="
            if gradle build dumpTestClasspath --no-daemon --stacktrace --console=plain \
               2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::gradle build failed on ${attempt} attempts - see gradle-build.log"
              exit 1
            fi
            attempt=$((attempt + 1))
            rm -f "$HOME/.gradle/caches/forge_gradle/McpMappings.json" \
                  "$HOME/.gradle/caches/forge_gradle/McpMappings.json.etag" \
                  "$HOME/.gradle/caches/forge_gradle/McManifest.json" \
                  "$HOME/.gradle/caches/forge_gradle/McManifest.json.etag"
            gradle --stop >/dev/null 2>&1 || true
            sleep 10
          done

      - name: Show build output tree
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== build/libs ==="; ls -la build/libs 2>&1 || true
          echo "=== classpath entries ==="; tr ':' '\n' < build/test-classpath.txt 2>/dev/null | head -20 || true

      - name: Collect JAR
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "build/libs/${JAR_NAME}" "$GITHUB_WORKSPACE/dist/${JAR_NAME}"
          ls -la "$GITHUB_WORKSPACE/dist"

      # git archive of the checkout revision: the ZIP is the source tree at the exact commit that was built.
      - name: Package source ZIP from the exact revision
        if: success()
        run: |
          set -euo pipefail
          git archive --format=zip -o "dist/${ZIP_NAME}" "HEAD:${PROJECT_DIR}"
          unzip -l "dist/${ZIP_NAME}" | sed -n '1,12p'
          echo "entries: $(unzip -Z1 "dist/${ZIP_NAME}" | wc -l)"

      # The checks run inside a function so their output can be teed into verify.log (kept as evidence), and the
      # exit status still fails the step. Note the "|| true" on the counting pipelines: a grep that finds nothing
      # exits 1, which under `set -o pipefail` would abort the step at the moment a check SUCCEEDS with zero hits.
      - name: Verify JAR metadata, reobfuscation, coremod hook and source revision
        if: success()
        run: |
          set -euo pipefail
          verify() {
          cd dist
          work=$(mktemp -d)
          unzip -o -q "${JAR_NAME}" -d "$work"

          echo "=== mcmod.info from the JAR ==="
          cat "$work/mcmod.info"

          ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' "$work/mcmod.info" | sed 's/.*"\([^"]*\)"$/\1/')
          mcver=$(grep -o '"mcversion"[[:space:]]*:[[:space:]]*"[^"]*"' "$work/mcmod.info" | sed 's/.*"\([^"]*\)"$/\1/')
          classes=$(find "$work" -name '*.class' | wc -l)

          cat $(find "$work" -name '*.class') > /tmp/all.class 2>/dev/null || true
          srg_names=$(grep -a -o -E '(func|field)_[0-9]+_[A-Za-z]+' /tmp/all.class | sort -u | wc -l || true)
          mcp_hits=$(grep -a -o -E '(^|[^A-Za-z])(getMinecraft|thePlayer|theWorld|gameSettings|playerController|displayGuiScreen|fontRendererObj|theEntityRenderer)([^A-Za-z]|$)' /tmp/all.class | sort -u || true)
          mcp_names=$(printf '%s' "$mcp_hits" | grep -c . || true)

          echo "mcmod.info version   : $ver"
          echo "mcmod.info mcversion : $mcver"
          echo "class files          : $classes"
          echo "srg member names     : $srg_names"
          echo "MCP member names left: $mcp_names"
          if [ -n "$mcp_hits" ]; then echo "MCP names found: $mcp_hits"; fi

          test "$ver" = "${EXPECTED_VERSION}" || { echo "::error::JAR version is '$ver', expected ${EXPECTED_VERSION}"; exit 1; }
          test "$mcver" = "1.8.9" || { echo "::error::JAR targets Minecraft '$mcver', expected 1.8.9"; exit 1; }
          test "$classes" -gt 40 || { echo "::error::only $classes class files in the JAR"; exit 1; }
          test "$srg_names" -gt 20 || { echo "::error::only $srg_names srg member names - jar looks unreobfuscated"; exit 1; }
          test "$mcp_names" -eq 0 || { echo "::error::$mcp_names MCP member names survive - jar is not reobfuscated"; exit 1; }
          if [ -d "$work/com/nef" ]; then echo "::error::unexpected com/nef package"; exit 1; fi

          echo "=== manifest (coremod hook) ==="
          unzip -p "${JAR_NAME}" META-INF/MANIFEST.MF
          unzip -p "${JAR_NAME}" META-INF/MANIFEST.MF | grep -qi 'FMLCorePlugin' \
            || { echo "::error::FMLCorePlugin missing from the manifest - the loading screen hook would not run"; exit 1; }
          unzip -p "${JAR_NAME}" META-INF/MANIFEST.MF | grep -qi 'FMLCorePluginContainsFMLMod' \
            || { echo "::error::FMLCorePluginContainsFMLMod missing from the manifest"; exit 1; }

          echo "=== early loading screen asset ==="
          test -f "$work/assets/pekaclient/textures/gui/skyvelor_splash.png" \
            || { echo "::error::the splash wordmark is not packaged in the jar"; exit 1; }
          ls -la "$work/assets/pekaclient/textures/gui/"

          echo "=== source ZIP sanity ==="
          unzip -Z1 "${ZIP_NAME}" | grep -q 'build.gradle' || { echo "::error::source ZIP has no build.gradle"; exit 1; }
          unzip -Z1 "${ZIP_NAME}" | grep -q 'PekaVersion.java' || { echo "::error::source ZIP has no PekaVersion.java"; exit 1; }
          unzip -Z1 "${ZIP_NAME}" | grep -q 'SkyVeLorLoadingPlugin.java' || { echo "::error::source ZIP has no coremod class"; exit 1; }

          # The ZIP must list exactly the tree of the built revision - no more, no less. Both lists are
          # relative to the project directory: git archive packs HEAD:<dir> with those relative paths, and
          # ls-tree -r HEAD:<dir> prints them the same way. git archive also writes directory entries into
          # the zip (they end with a slash) while ls-tree lists blobs only, so those are filtered out.
          git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only "HEAD:${PROJECT_DIR}" | sort > /tmp/git-tree.txt
          unzip -Z1 "${ZIP_NAME}" | grep -v "/$" | sort > /tmp/zip-tree.txt
          if ! diff -u /tmp/git-tree.txt /tmp/zip-tree.txt > /tmp/tree-diff.txt; then
            echo "::error::source ZIP does not match the built revision"; cat /tmp/tree-diff.txt; exit 1
          fi
          echo "source ZIP file list matches git tree of $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD) exactly"

          {
            echo "revision     : $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "branch       : ${GITHUB_REF_NAME:-unknown}"
            echo "java         : $(java -version 2>&1 | head -1)"
            echo "gradle       : ${GRADLE_VERSION}"
            echo "mcmod.info   : version=$ver mcversion=$mcver"
            echo "class files  : $classes"
            echo "srg members  : $srg_names   (0 MCP member names left)"
            echo "coremod hook : FMLCorePlugin present, splash wordmark packaged"
            echo
            echo "sha256 ${JAR_NAME}: $(sha256sum "${JAR_NAME}" | cut -d' ' -f1)"
            echo "sha256 ${ZIP_NAME}: $(sha256sum "${ZIP_NAME}" | cut -d' ' -f1)"
          } | tee BUILD-INFO.txt
          }
          verify 2>&1 | tee "$GITHUB_WORKSPACE/verify.log"

      # The tests/ folder is not a Gradle source set, so `gradle build` never runs it. Every suite is run here
      # against the classpath the build itself used (build/test-classpath.txt).
      - name: Run all logic test suites
        if: success()
        continue-on-error: true
        id: tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          {
            OUT=$(mktemp -d)
            CP="$PWD/build/classes/main:$(cat build/test-classpath.txt)"
            echo "compiling test sources"
            javac -nowarn -cp "$CP" -d "$OUT" $(find tests -name '*.java')
            echo "compiled $(find tests -name '*.java' | wc -l) test files"
            for t in $(cd "$OUT" && find . -name '*Tests.class' | sed 's#^\./##; s#/#.#g; s#\.class$##' | sort); do
              echo "--- $t"
              java -cp "$OUT:$CP" "$t" || echo "SUITE FAILED: $t"
            done
          } 2>&1 | tee "$GITHUB_WORKSPACE/test-suites.log"

      - name: Assemble build report
        if: always()
        run: |
          {
            echo "## SkyVeLor ${EXPECTED_VERSION} - automated build report"
            echo
            echo '```'
            cat dist/BUILD-INFO.txt 2>/dev/null || echo "no BUILD-INFO.txt (build did not reach the verify step)"
            echo '```'
            echo
            echo "### Test suites"
            echo
            echo '```'
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              grep -E "^(---|.*passed .*failed|SUITE FAILED)" test-suites.log 2>/dev/null | tail -40 \
                || echo "no test output captured"
            else
              echo "step outcome: ${{ steps.tests.outcome }}"
              tail -30 test-suites.log 2>/dev/null || true
            fi
            echo '```'
          } > build-report.md
          cat build-report.md

      # Actions artifacts and raw logs live on hosts that some sandboxed clients cannot reach. Pushing the same
      # evidence to a scratch branch keeps it retrievable with plain git over github.com.
      - name: Publish evidence to ci-evidence branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf evidence && mkdir evidence
          cp gradle-build.log build-report.md evidence/ 2>/dev/null || true
          cp test-suites.log verify.log evidence/ 2>/dev/null || true
          cp -r dist evidence/dist 2>/dev/null || true
          cp -r "$PROJECT_DIR/build/libs" evidence/libs 2>/dev/null || true
          # A run whose build failed produces no dist/, and this branch is force-pushed, so the artifacts of the
          # last run that did succeed are carried over - the evidence branch always holds a jar that matches a
          # green build instead of losing it to a later failed run.
          if [ ! -d evidence/dist ]; then
            if git clone -q --depth 1 --branch ci-evidence \
                 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/prev-evidence 2>/dev/null; then
              cp -r /tmp/prev-evidence/dist evidence/dist 2>/dev/null || true
            fi
            rm -rf /tmp/prev-evidence
          fi
          ls -laR evidence | head -40
          cd evidence
          git init -q .
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git config user.name "arena-agent"
          git checkout -q -b ci-evidence
          git add -A
          git commit -q -m "CI evidence for ${GITHUB_SHA} run ${GITHUB_RUN_ID} [skip ci]" || true
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-evidence

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            gradle-build.log
            build-report.md
            test-suites.log
            verify.log
          if-no-files-found: warn

      - name: Upload JAR and source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkyVeLor-1.8.9-Beta-0.8v
          path: |
            dist/SkyVeLor-1.8.9-Beta-0.8v.jar
            dist/SkyVeLor-1.8.9-Beta-0.8v-source.zip
            dist/BUILD-INFO.txt
          if-no-files-found: error

      # A release makes the two files directly downloadable by exact name, and the release body carries the
      # verification report. Re-running overwrites the same tag. Permissions problems must not hide a green build.
      - name: Publish release with verification report
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="beta-0.8v"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar dist/*.zip dist/BUILD-INFO.txt --clobber
            gh release edit "$TAG" --title "SkyVeLor ${EXPECTED_VERSION}" --notes-file build-report.md
          else
            gh release create "$TAG" dist/*.jar dist/*.zip dist/BUILD-INFO.txt \
              --title "SkyVeLor ${EXPECTED_VERSION}" --notes-file build-report.md
          fi
