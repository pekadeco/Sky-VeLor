name: Build Sky VeLor Beta-0.10v

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and verify Beta-0.10v
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      GRADLE_VERSION: '2.14.1'
      JAR_NAME: SkyVeLor-1.8.9-Beta-0.10v.jar
      ZIP_NAME: SkyVeLor-1.8.9-Beta-0.10v-source.zip
      EXPECTED_VERSION: Beta-0.10v
      GRADLE_OPTS: '-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Report toolchain
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "revision=$(git rev-parse HEAD)"

      - name: Install Gradle 2.14.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Build Forge mod and export test classpath
        run: |
          set -o pipefail
          attempt=1
          while true; do
            echo "=== gradle build, attempt ${attempt}/3 ==="
            if gradle build dumpTestClasspath --no-daemon --stacktrace --console=plain \
                 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Gradle build failed after ${attempt} attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            rm -f "$HOME/.gradle/caches/forge_gradle/McpMappings.json" \
                  "$HOME/.gradle/caches/forge_gradle/McpMappings.json.etag" \
                  "$HOME/.gradle/caches/forge_gradle/McManifest.json" \
                  "$HOME/.gradle/caches/forge_gradle/McManifest.json.etag"
            gradle --stop >/dev/null 2>&1 || true
            sleep 10
          done

      - name: Run all logic test suites
        run: |
          set -euo pipefail
          TEST_CP="$(cat build/test-classpath.txt)" sh tests/run-tests.sh \
            2>&1 | tee "$GITHUB_WORKSPACE/test-suites.log"

      - name: Package JAR and exact-source archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/libs/${JAR_NAME}" "dist/${JAR_NAME}"
          git archive --format=zip --output="dist/${ZIP_NAME}" HEAD
          unzip -t "dist/${JAR_NAME}" >/dev/null
          unzip -t "dist/${ZIP_NAME}" >/dev/null

      - name: Verify release contents and metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          work=$(mktemp -d)
          unzip -q "dist/${JAR_NAME}" -d "$work"
          mcmod="$work/mcmod.info"
          test -f "$mcmod"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"Beta-0\.10v"' "$mcmod"
          grep -Eq '"mcversion"[[:space:]]*:[[:space:]]*"1\.8\.9"' "$mcmod"
          classes=$(find "$work" -name '*.class' | wc -l)
          test "$classes" -gt 40
          test -f "$work/com/arena/pekaclient/feature/LeapClassCache.class"
          test -f "$work/com/arena/pekaclient/feature/LeapIdentity.class"
          test -f "$work/com/arena/pekaclient/feature/LeapDiagnostics.class"
          test -f "$work/com/arena/pekaclient/gui/LeapScreen.class"

          cat $(find "$work" -name '*.class') > /tmp/all.class 2>/dev/null || true
          srg_names=$(grep -a -o -E '(func|field)_[0-9]+_[A-Za-z]+' /tmp/all.class | sort -u | wc -l || true)
          mcp_hits=$(grep -a -o -E '(^|[^A-Za-z])(getMinecraft|thePlayer|theWorld|gameSettings|playerController|displayGuiScreen|fontRendererObj|theEntityRenderer)([^A-Za-z]|$)' /tmp/all.class | sort -u || true)
          mcp_names=$(printf '%s' "$mcp_hits" | grep -c . || true)
          test "$srg_names" -gt 20
          test "$mcp_names" -eq 0

          unzip -Z1 "dist/${ZIP_NAME}" | grep -q '^build.gradle$'
          unzip -Z1 "dist/${ZIP_NAME}" | grep -q '^src/main/java/com/arena/pekaclient/gui/LeapScreen.java$'
          unzip -Z1 "dist/${ZIP_NAME}" | grep -q '^tests/com/arena/pekaclient/feature/LeapClassCacheTests.java$'
          git archive --format=tar HEAD | tar -tf - | grep -v '/$' | sort > /tmp/archive-tree.txt
          unzip -Z1 "dist/${ZIP_NAME}" | grep -v '/$' | sort > /tmp/zip-tree.txt
          diff -u /tmp/archive-tree.txt /tmp/zip-tree.txt

          unzip -p "dist/${JAR_NAME}" META-INF/MANIFEST.MF > dist/MANIFEST.txt
          {
            echo "revision     : $(git rev-parse HEAD)"
            echo "branch       : ${GITHUB_REF_NAME:-unknown}"
            echo "java         : $(java -version 2>&1 | head -1)"
            echo "gradle       : ${GRADLE_VERSION}"
            echo "mcmod.info   : version=${EXPECTED_VERSION} mcversion=1.8.9"
            echo "class files  : ${classes}"
            echo "srg members  : ${srg_names} (0 MCP member names left)"
            echo "source ZIP   : matches git archive tree; dist/ excluded"
            echo "test suites  : $(grep -c '^.*passed .*failed 0$' test-suites.log) passing summaries"
            echo
            echo "sha256 ${JAR_NAME}: $(sha256sum "dist/${JAR_NAME}" | cut -d' ' -f1)"
            echo "sha256 ${ZIP_NAME}: $(sha256sum "dist/${ZIP_NAME}" | cut -d' ' -f1)"
          } | tee dist/BUILD-INFO.txt

          {
            echo "# Sky VeLor ${EXPECTED_VERSION} automated build report"
            echo
            echo '```'
            cat dist/BUILD-INFO.txt
            echo '```'
            echo
            echo '## Test suites'
            echo
            echo '```'
            grep -E '^(leap text|leap identity|leap class cache|.*: passed .*failed 0|passed [0-9]+, failed 0)' \
              test-suites.log || true
            echo '```'
            echo
            echo 'In-game verification: not performed by this workflow.'
          } | tee dist/build-report.md

      - name: Upload release files and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-velor-beta-0.10v-release
          if-no-files-found: warn
          path: |
            dist/${{ env.JAR_NAME }}
            dist/${{ env.ZIP_NAME }}
            dist/BUILD-INFO.txt
            dist/build-report.md
            dist/MANIFEST.txt
            gradle-build.log
            test-suites.log
