name: Build Lunaria Mod

# The ForgeGradle 2.1 / Minecraft 1.8.9 toolchain needs a JDK 8 and network access to the Forge
# Maven and Mojang's servers. This workflow is that environment: it checks out the revision it was
# triggered by, builds with the project's own Gradle wrapper, runs the standalone tests, verifies
# that the output really is the reobfuscated Lunaria Mod jar, and publishes branch artifacts.
#
# Nothing here hardcodes a version or a revision. The version is read from PekaVersion.NAME, which
# build.gradle also reads, so the jar name, mcmod.info and verification all follow the source automatically.
#
# Compilation/test-only stage commits deliberately do not publish distributables. Publishing requires the explicit
# [publish-artifacts] commit marker, used only after the release version has been updated and verification passed.
# The dist/ publish step commits the verified artifacts back to the branch; no GitHub Release is created here.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [ main ]

env:
  # Resolved once and reused; never hardcoded, so a version bump needs no workflow edit.
  VERSION_FILE: src/main/java/com/arena/pekaclient/PekaVersion.java

jobs:
  build:
    name: Build with Java 8
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the revision this run was triggered by
        uses: actions/checkout@v4
        with:
          # Keep history available for source-archive provenance and branch artifact publication.
          fetch-depth: 0

      - name: Set up Java 8 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache the Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle8-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle8-

      - name: Resolve the release version from source
        run: |
          set -e
          VERSION=$(grep -oE 'NAME *= *"[^"]+"' "$VERSION_FILE" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error title=VERSION::could not read PekaVersion.NAME from $VERSION_FILE"
            exit 1
          fi
          MCMOD_VERSION=$(printf '%s' "$VERSION" | sed -E 's/^Beta-//; s/v$//')
          if ! printf '%s' "$MCMOD_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error title=VERSION::could not resolve numeric mcmod.info version from $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MCMOD_VERSION=$MCMOD_VERSION" >> "$GITHUB_ENV"
          echo "JAR_NAME=Lunaria-Mod-1.8.9-$VERSION.jar" >> "$GITHUB_ENV"
          echo "ZIP_NAME=Lunaria-Mod-1.8.9-$VERSION.zip" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP_NAME=Lunaria-Mod-1.8.9-$VERSION-source.zip" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=Lunaria-Mod-1.8.9-$VERSION-source/" >> "$GITHUB_ENV"
          {
            echo "revision : $(git rev-parse HEAD)"
            echo "branch   : ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "version  : $VERSION"
            echo "mcmod    : $MCMOD_VERSION"
            echo "java     : $(java -version 2>&1 | head -1)"
          } | tee "$RUNNER_TEMP/revision.txt"

      - name: Build the mod (ForgeGradle 2.1, Minecraft 1.8.9)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --version 2>&1 | tee "$RUNNER_TEMP/gradle-version.txt"
          if ! ./gradlew clean build dumpTestClasspath --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Surface actionable compiler/dependency lines as annotations when Actions log redirects are unavailable.
            grep -E '(^|[[:space:]])(error:|FAILURE:|Could not |Exception|Execution failed|[0-9]+ errors?)' \
              "$RUNNER_TEMP/build.log" | tail -50 | while IFS= read -r line; do
                echo "::error title=GRADLE::${line}"
              done
            exit 1
          fi
          echo "=== tasks that produced the jar ==="
          grep -E "^:(compileJava|jar|reobfJar|sourceJar|assemble|check|build)" "$RUNNER_TEMP/build.log" || true
          tail -6 "$RUNNER_TEMP/build.log"

      - name: Inventory every jar produced
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -lh build/libs/ 2>/dev/null || echo "build/libs not found"
          echo "=== every jar under build/ ==="
          # build/tmp/deobfMcMCP/deobfed.jar is ForgeGradle's deobfuscated Minecraft, about 11 MB.
          # It is NOT the mod. A previous release was published from it by mistake.
          find build -name '*.jar' -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2

      - name: Run the standalone logic tests
        run: |
          set -o pipefail
          if ! TEST_CP="$(cat build/test-classpath.txt)" sh tests/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            # Action log downloads may be blocked by a redirect in restricted environments. Mirror the actual
            # assertion lines into check annotations so a failed headless suite is always diagnosable.
            grep -E '^(FAIL |.*passed [0-9]+, failed [1-9])' "$RUNNER_TEMP/tests.log" | tail -50 | while IFS= read -r line; do
              echo "::error title=LOGIC-TEST::${line}"
            done
            # Some retained source-layout tests deliberately throw AssertionError rather than keeping a counter.
            # Mirror the final output lines into annotations too, so restricted Action-log redirects never hide the
            # failing suite, compiler diagnostic, or assertion stack line.
            tail -50 "$RUNNER_TEMP/tests.log" | while IFS= read -r line; do
              echo "::error title=LOGIC-TEST-TAIL::${line}"
            done
            echo "::error title=LOGIC-TEST::tests/run-tests.sh exited nonzero"
            exit 1
          fi
          echo "=== suites ==="
          grep -E "passed [0-9]+, failed" "$RUNNER_TEMP/tests.log" | tail -40

      - name: Render and inspect headless Apple layout previews
        run: |
          set -e
          sh tools/run_apple_layout_renderer.sh "$RUNNER_TEMP/apple-layout-previews"
          # Keep the review surface intentionally small: exactly Home, Dungeons, and scale-4 Home previews.
          test "$(find "$RUNNER_TEMP/apple-layout-previews" -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 3

      - name: Upload Apple layout preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: apple-layout-previews-${{ github.sha }}
          path: ${{ runner.temp }}/apple-layout-previews/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify the release jar is really the reobfuscated mod
        run: |
          # GitHub's default shell is `bash -e -o pipefail`, which would abort on the verifier's
          # first nonzero status before it printed why. Report first, then fail.
          set +e +o pipefail
          JAR="$PWD/build/libs/$JAR_NAME"
          echo "expected artifact: $JAR"
          if [ ! -f "$JAR" ]; then
            echo "::error title=JAR::$JAR_NAME was not produced"
            find "$PWD/build" -name '*.jar' -printf '%10s %p\n' | sort -k2
            exit 1
          fi
          python3 tools/verify_release_jar.py "$JAR" --version "$VERSION" --mcmod-version "$MCMOD_VERSION" > "$RUNNER_TEMP/verify.txt" 2>&1
          RC=$?
          cat "$RUNNER_TEMP/verify.txt"
          grep '^  FAIL' "$RUNNER_TEMP/verify.txt" | while read -r line; do
            echo "::error title=JAR-VERIFY::${line}"
          done
          tail -1 "$RUNNER_TEMP/verify.txt" | while read -r line; do
            echo "::notice title=JAR-VERIFY::${line}"
          done
          if [ "$RC" != "0" ]; then
            echo "::error title=JAR::release verification failed with exit $RC"
            exit "$RC"
          fi
          echo "::notice title=JAR::verified $JAR_NAME $(stat -c%s "$JAR") bytes version=$VERSION"

      - name: Create and verify the curated source ZIP
        run: |
          set -e
          SOURCE_ZIP="build/delivery/$SOURCE_ZIP_NAME"
          mkdir -p build/delivery
          # This explicit allow-list is intentional: git archive never receives dist/, build/, .git/,
          # IDE state, generated artifacts, or any untracked local file. The wrapper JAR is retained
          # because it is required to build the released source tree.
          git archive --format=zip --prefix="$SOURCE_ROOT" HEAD -- .github .gitignore BUILD-VERIFICATION.md CHANGELOG.md DIAGNOSTIC_REPORT.md LICENSE NOTICE.md README.md THIRD-PARTY-NOTICES.md VERIFICATION.md privacy.md build.gradle docs gradle gradlew gradlew.bat settings.gradle src tests tools > "$SOURCE_ZIP"
          if ! python3 tools/verify_source_zip.py "$SOURCE_ZIP" --version "$VERSION" > "$RUNNER_TEMP/source-verify.txt" 2>&1; then
            cat "$RUNNER_TEMP/source-verify.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/source-verify.txt"
          echo "::notice title=SOURCE::verified $SOURCE_ZIP_NAME $(stat -c%s "$SOURCE_ZIP") bytes"

      - name: Write the build report
        run: |
          set -e
          JAR="build/libs/$JAR_NAME"
          SOURCE_ZIP="build/delivery/$SOURCE_ZIP_NAME"
          {
            echo "The Sky’s Lunaria Mod $VERSION build report"
            echo "================================"
            cat "$RUNNER_TEMP/revision.txt"
            echo "run      : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "gradle:"
            sed -n '1,12p' "$RUNNER_TEMP/gradle-version.txt"
            echo
            echo "jar      : dist/$JAR_NAME"
            echo "size     : $(stat -c%s "$JAR") bytes"
            echo "sha256   : $(sha256sum "$JAR" | cut -d' ' -f1)"
            echo "source   : dist/$SOURCE_ZIP_NAME"
            echo "source size: $(stat -c%s "$SOURCE_ZIP") bytes"
            echo "source sha256: $(sha256sum "$SOURCE_ZIP" | cut -d' ' -f1)"
            echo
            echo "gradle tasks that produced the jar:"
            grep -E "^:(compileJava|jar|reobfJar|sourceJar|assemble|check|build)" "$RUNNER_TEMP/build.log" || echo "(none listed)"
            echo
            echo "reobfuscated: verified as a packaged Lunaria Forge mod by tools/verify_release_jar.py"
            echo "              with public metadata, required runtime surfaces and supplied artwork present."
            echo
            echo "test suites:"
            grep -E "passed [0-9]+, failed" "$RUNNER_TEMP/tests.log" || true
            echo
            echo "release JAR verification:"
            cat "$RUNNER_TEMP/verify.txt"
            echo
            echo "source ZIP verification:"
            cat "$RUNNER_TEMP/source-verify.txt"
          } > BUILD-REPORT.txt
          grep -vE '^      (func|field)_' BUILD-REPORT.txt | tail -45

      - name: Create the delivery zip
        run: |
          set -e
          JAR="build/libs/$JAR_NAME"
          ZIP="build/delivery/$ZIP_NAME"
          mkdir -p build/delivery
          python3 - "$JAR" "$ZIP" BUILD-REPORT.txt <<'PY'
          import os
          import sys
          import zipfile
          jar, output, report = sys.argv[1:]
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write(jar, os.path.basename(jar))
              archive.write(report, os.path.basename(report))
          with zipfile.ZipFile(output) as archive:
              print('delivery zip:', output)
              for item in archive.infolist():
                  print('  %s %d bytes' % (item.filename, item.file_size))
          PY

      - name: Publish the three release artifacts into dist/ on this branch
        # Stage commits still compile and test, but only the explicit release commit may persist delivery files.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-artifacts]')
        run: |
          set +e +o pipefail
          # A release directory is deliberately a three-file delivery surface: the JAR, delivery ZIP,
          # and reproducible source ZIP. Remove every prior artifact only after all verification passes.
          rm -rf dist
          mkdir -p dist
          cp -v "build/libs/$JAR_NAME" "dist/$JAR_NAME"
          cp -v "build/delivery/$ZIP_NAME" "dist/$ZIP_NAME"
          cp -v "build/delivery/$SOURCE_ZIP_NAME" "dist/$SOURCE_ZIP_NAME"
          EXPECTED=$(printf '%s\n' "$JAR_NAME" "$SOURCE_ZIP_NAME" "$ZIP_NAME" | sort)
          ACTUAL=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=DIST::dist/ must contain exactly the release JAR, delivery ZIP and source ZIP"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A dist
          if git diff --cached --quiet; then
            echo "dist/ is already up to date"
            exit 0
          fi
          git commit -m "Publish $JAR_NAME built from $GITHUB_SHA [skip ci]"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RC=$?
          echo "push exit=$RC"
          if [ "$RC" != "0" ]; then
            echo "::error title=DIST::could not publish dist/ (exit $RC)"
            exit "$RC"
          fi
          echo "::notice title=DIST::published dist/$JAR_NAME, $ZIP_NAME and $SOURCE_ZIP_NAME"

      # Deliberately no GitHub Release step: verified artifacts are published only to this branch
      # in dist/ when a maintainer explicitly uses the [publish-artifacts] marker.

      - name: Upload the verified release artifacts
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-artifacts]')
        uses: actions/upload-artifact@v4
        with:
          name: Lunaria-Mod-1.8.9-${{ env.VERSION }}
          path: |
            build/libs/${{ env.JAR_NAME }}
            build/delivery/${{ env.ZIP_NAME }}
            build/delivery/${{ env.SOURCE_ZIP_NAME }}
            BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/
            build/logs/
          if-no-files-found: ignore
          retention-days: 14
