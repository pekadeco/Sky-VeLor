name: Build Sky VeLor

# The ForgeGradle 2.1 / Minecraft 1.8.9 toolchain needs a JDK 8 and network access to the Forge Maven
# and Mojang's asset servers. This workflow is that environment: it checks out the branch it runs on,
# builds the mod with the project's own Gradle wrapper, runs the standalone logic tests, verifies that
# the output really is the Sky VeLor mod JAR, and uploads it.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build with Java 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the branch this run was started from
        uses: actions/checkout@v4

      - name: Set up Java 8 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Verify the Java version
        run: |
          echo "Java version:"
          java -version
          echo "Javac version:"
          javac -version

      - name: Cache the Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle8-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle8-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the mod (ForgeGradle 2.1, Minecraft 1.8.9)
        id: build
        run: ./gradlew clean build dumpTestClasspath --stacktrace

      - name: Show the build output
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -la build/libs/ 2>/dev/null || echo "build/libs not found"
          echo "=== every jar produced ==="
          find build -name '*.jar' -type f 2>/dev/null | sort

      - name: Run the standalone logic tests
        run: TEST_CP="$(cat build/test-classpath.txt)" sh tests/run-tests.sh

      - name: Verify the release JAR
        id: verify
        run: |
          set -e
          JAR="build/libs/SkyVeLor-1.8.9-Beta-0.10.6.5v.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::$JAR was not produced"
            exit 1
          fi
          ls -lh "$JAR"

          echo "=== mod classes ==="
          unzip -l "$JAR" | grep -E "com/arena/pekaclient/(PekaClientMod|PekaVersion|gui/TerminalScreen|gui/DungeonHudScreen|dungeon/TerminalSolver|hud/ClickInOrderHud)\.class"

          echo "=== resources ==="
          unzip -l "$JAR" | grep -E "mcmod.info|assets/pekaclient/lang/en_US.lang"

          echo "=== mcmod.info ==="
          unzip -p "$JAR" mcmod.info

          echo "=== version metadata inside the compiled class ==="
          unzip -p "$JAR" com/arena/pekaclient/PekaVersion.class | grep -a "Beta-0.10.6.5v"

          echo "=== the JAR must be the mod, not an intermediate Minecraft jar ==="
          if unzip -l "$JAR" | grep -q "net/minecraft/"; then
            echo "::error::the JAR contains Minecraft classes, so it is an intermediate jar"
            exit 1
          fi
          if unzip -l "$JAR" | grep -qE "deobf|deobfed"; then
            echo "::error::the JAR looks like a deobfuscated intermediate jar"
            exit 1
          fi

          echo "class count in the JAR: $(unzip -l "$JAR" | grep -c '\.class$')"
          echo "::notice::$JAR verified"

      - name: Upload the release JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyVeLor-1.8.9-Beta-0.10.6.5v
          path: build/libs/SkyVeLor-1.8.9-Beta-0.10.6.5v.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/
            build/logs/
          if-no-files-found: ignore
          retention-days: 14
