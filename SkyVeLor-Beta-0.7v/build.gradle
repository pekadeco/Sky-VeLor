// ForgeGradle 2.1 build for Minecraft 1.8.9 (Forge 11.15.1.2318-1.8.9, MCP stable_22).
// Requires JDK 8 and Gradle 2.14.x (2.14.1 is the version this project is built with).
//
// ForgeGradle plugin version: 2.1-SNAPSHOT, published on the Forge Maven. The FG_2.1 branch is
// still maintained and was moved to the current Forge Maven endpoint
// (https://maven.minecraftforge.net) in 2021, so this resolves over HTTPS with no local
// `gradle install` / ~/.m2 step. There is no "0.0.0" artifact on any public repository.
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenLocal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

// ForgeGradle adds the Forge Maven, Maven Central and the Mojang library repository itself.
// jcenter() was removed: it was sunset by JFrog and no ForgeGradle 2.1 dependency needs it.
repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    mavenLocal()
}

// Version: read from PekaVersion.NAME so there is exactly one place to change it (Sky VeLor Beta-0.3v).
def pekaVersionSource = file('src/main/java/com/arena/pekaclient/PekaVersion.java').text
def pekaVersionMatch = (pekaVersionSource =~ /NAME\s*=\s*"([^"]+)"/)
if (!pekaVersionMatch.find()) {
    throw new GradleException('Could not read PekaVersion.NAME from PekaVersion.java')
}
version = pekaVersionMatch.group(1)
group = "com.arena.pekaclient"
archivesBaseName = "SkyVeLor-1.8.9"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
